<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login</title>
  <link rel="stylesheet" href="static/css/login.css">
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="d-flex justify-content-center align-items-center vh-100">
  <!-- Loader de pantalla completa -->
  <div class="loader-overlay" id="loginLoader">
    <div class="loader">
      <div class="cube">
        <div class="face"></div>
        <div class="face"></div>
        <div class="face"></div>
        <div class="face"></div>
        <div class="face"></div>
        <div class="face"></div>
      </div>
    </div>
    <div class="loader-text">Iniciando sesión...</div>
  </div>

  <!-- Formulario de login -->
  <div class="login-box">
    <p>Login</p>
    <form id="loginForm">
      <div class="user-box">
        <input required="" id="usuario" name="usuario" type="email" autocomplete="username">
        <label>Email</label>
      </div>
      <div class="user-box">
        <input required="" id="password" name="password" type="password" autocomplete="current-password">
        <label>Password</label>
      </div>
      <p id="error" style="color: #ff6b6b; font-size: 14px; margin: 10px 0; min-height: 20px;"></p>
      <a href="javascript:void(0);" id="submitBtn">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        Submit
      </a>
    </form>
  </div>

  <!-- Firebase SDK -->
  <script type="module" src="static/js/login.js"></script>
</body>

</html>
