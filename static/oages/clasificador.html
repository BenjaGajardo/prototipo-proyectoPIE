<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Estudiantes - PIE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="static/css/style_clasi.css">
</head>
<body>

<main class="container py-4">
    <section>
        <div class="row g-4" id="studentContainer">
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card border-0 shadow-sm rounded-3 student-card bg-white position-relative overflow-hidden">
                    <div class="card-body">
                        <div class="d-flex align-items-center mb-3">
                            <div class="me-3">
                                <div class="avatar-circle bg-primary bg-opacity-10 text-primary fw-semibold">
                                    MN
                                </div>
                            </div>
                            <div class="flex-grow-1">
                                <h6 class="mb-0 text-slate-800 fw-semibold">Matias Nuñez</h6>
                                <small class="text-slate-500">3° Básico B · NEE</small>
                            </div>
                            <span class="pill-status bg-success bg-opacity-10 text-success fw-semibold">
                                Activo
                            </span>
                        </div>

                        <div class="mb-3">
                            <label class="form-label mb-1 small text-slate-500">Asistencia clase de hoy</label>
                            <div class="btn-group btn-group-sm w-100" role="group">
                                <input type="radio" class="btn-check" name="asistencia-105" id="asiste-105" checked>
                                <label class="btn btn-outline-success" for="asiste-105">
                                    <i class="fas fa-check-circle me-1"></i> Asistente
                                </label>
                                <input type="radio" class="btn-check" name="asistencia-105" id="inasiste-105">
                                <label class="btn btn-outline-danger" for="inasiste-105">
                                    <i class="fas fa-times-circle me-1"></i> Inasistente
                                </label>
                            </div>
                        </div>

                        <div class="d-flex flex-wrap gap-1 mb-3">
                            <span class="chip"><i class="fas fa-star text-warning me-1"></i>Promedio: 6,2</span>
                            <span class="chip"><i class="fas fa-book-open me-1"></i>Lenguaje: 6,4</span>
                            <span class="chip"><i class="fas fa-user-friends me-1"></i>PIE activo</span>
                        </div>

                        <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center">
                            <button class="btn btn-primary btn-sm d-flex align-items-center gap-1" 
                                    data-bs-toggle="modal" data-bs-target="#modalEstudiante" 
                                    onclick="cargarEstudianteDemo('Matias Nuñez', '3° Básico B', 'MN')">
                                <i class="fas fa-info-circle"></i> Ver información
                            </button>
                            <button class="btn btn-outline-primary btn-sm d-flex align-items-center gap-1">
                                <i class="fas fa-phone-alt"></i> Llamar PIE
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>

<div class="modal fade" id="modalEstudiante" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
        <div class="modal-content border-0 shadow-xl rounded-3">
            <div class="modal-header border-0 pb-0">
                <div class="d-flex align-items-center gap-3">
                    <div id="modalAvatar" class="avatar-circle-lg bg-primary bg-opacity-10 text-primary fw-semibold">
                        AG
                    </div>
                    <div>
                        <h5 class="modal-title fw-bold text-slate-800" id="modalNombre">Ana González</h5>
                        <p class="mb-0 small text-slate-500" id="modalCurso">1° Básico A · NEE · PIE</p>
                    </div>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body pt-2">
                <div class="tabs-container mb-3">
                    <div role="tablist" class="nav nav-tabs border-0 flex-nowrap overflow-x-auto">
                        <button class="nav-link active" onclick="mostrarSeccion('general', this)">Info general</button>
                        <button class="nav-link" onclick="mostrarSeccion('planificacion', this)">Planificación</button>
                        <button class="nav-link" onclick="mostrarSeccion('pie', this)">Contacto PIE</button>
                        <button class="nav-link" onclick="mostrarSeccion('intervencion', this)">Intervención (PII)</button>
                        <button class="nav-link" onclick="mostrarSeccion('calificaciones', this)">Calificaciones</button>
                        <button class="nav-link" onclick="mostrarSeccion('documentos', this)">Documentación</button>
                        <button class="nav-link" onclick="mostrarSeccion('emocional', this)">Eval. emocional</button>
                    </div>
                </div>

                <div id="secciones-container">
                    <div id="seccion-general" class="tab-content-active">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <div class="card border-0 shadow-sm rounded-3 h-100">
                                    <div class="card-body">
                                        <h6 class="fw-semibold mb-2">Datos generales</h6>
                                        <dl class="row mb-0 small">
                                            <dt class="col-5 text-slate-500">RUT</dt>
                                            <dd class="col-7" id="modalRut">22.222.222-2</dd>
                                            <dt class="col-5 text-slate-500">Diagnóstico</dt>
                                            <dd class="col-7">TEA · TEL</dd>
                                        </dl>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="static/js/script_clasi.js"></script>
</body>
</html>
