<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Estilos propios -->
    <link rel="stylesheet" href="static/css/style.css">
    <link rel="stylesheet" href="static/css/login.css">
</head>

<body class="d-flex justify-content-center align-items-center vh-100 bg-light">

<div class="login-box">
  <p>Login</p>
  <form id="loginForm">
    <div class="user-box">
      <input required="" id="usuario" name="usuario" type="text" autocomplete="username">
      <label>Email</label>
    </div>
    <div class="user-box">
      <input required="" id="password" name="password" type="password" autocomplete="current-password">
      <label>Password</label>
    </div>
    <p id="error" style="color: #ff6b6b; font-size: 14px; margin: 10px 0; min-height: 20px;"></p>
    <a href="#" id="submitBtn">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      Submit
    </a>
  </form>
</div>

    <!-- JAVASCRIPT -->
    <script>
        function login(event) {
            event.preventDefault(); // Evita que el formulario recargue la página

            const usuario = document.getElementById("usuario").value.trim();
            const password = document.getElementById("password").value.trim();
            const error = document.getElementById("error");

            error.textContent = "";

            // Validar campos vacíos
            if (usuario === "" || password === "") {
                error.textContent = "Debe completar todos los campos";
                return;
            }

            // Login de prueba (DEMO)
            if (usuario === "admin" && password === "1234") {
                window.location.href = "index.html"; // página destino
            } else {
                error.textContent = "Usuario o contraseña incorrectos";
            }
        }
    </script>
    <script src="static/js/login.js"></script>
</body>
</html>
